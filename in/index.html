<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    
    <script data-goatcounter="https://pricelist.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مکمل جنوب</title>
    <style>
        /* ریست حاشیه‌ها و فاصله‌ها */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* بدنه اصلی: ارتفاع کامل صفحه، غیرقابل اسکرول */
        body {
            background: linear-gradient(145deg, #1e2a2e 0%, #0f1a1f 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;          /* پنهان کردن اسکرول در کل صفحه */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Tahoma', 'system-ui', 'Roboto', sans-serif;
            padding: 16px;
            margin: 0;
            position: fixed;           /* جلوگیری از هرگونه حرکت غیرمنتظره */
            top: 0;
            left: 0;
        }

        /* کانتینر اصلی برای ثابت نگه داشتن محتوا و متمرکز سازی */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        /* قاب مربع با حاشیه‌های خمیده (border-radius) */
        .card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 248, 235, 0.97);
            backdrop-filter: blur(0px);
            border-radius: 48px;          /* حاشیه کاملاً خمیده و نرم */
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 150, 0.3);
            padding: 28px 24px 32px 24px;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* محفظه عکس: مربعی با حاشیه خمیده + انیمیشن بالا پایین */
        .image-frame {
            width: 260px;                /* بزرگ‌تر شد از 220 به 260 */
            height: 260px;               /* بزرگ‌تر شد از 220 به 260 */
            margin: 0 auto 20px auto;
            border-radius: 45px;         /* حاشیه خمیده متناسب با اندازه جدید */
            overflow: hidden;
            background: #e9e2d4;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,240,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffc96e;
            
   
        }

        /* استایل عکس: بزرگ‌تر و با کیفیت */
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* عکس کل فضا را می‌پوشاند - بزرگ دیده می‌شود */
            display: block;
        }
        
        /* افکت کوچک هنگام هاور (دلخواه - اگر موس روی عکس برود کمی بزرگتر شود) */
        .image-frame:hover .product-img {
            transform: scale(1.02);
        }

        /* دکمه لیست قیمت */
        .price-btn {
            background: linear-gradient(95deg, #c27e2e, #e09d3e);
            border: none;
            color: #1e2a1f;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 28px;
            margin: 16px 0 18px 0;
            width: 85%;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
            box-shadow: 0 6px 0 0 #7e4a1a;
            transform: translateY(-2px);
            font-weight: 800;
        }

        .price-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 #7e4a1a;
        }

        /* دکمه بازگشت به اینستاگرام */
        .instagram-btn {
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: auto;
            padding: 10px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 6px 14px rgba(188, 24, 136, 0.35);
            transition: 0.2s;
        }

        .instagram-btn:active {
            transform: translateY(2px);
        }

        /* ساعت پشتیبانی فروش */
        .support-hours {
            margin-top: 16px;
            font-size: 0.7rem;
            color: #6b4e2e;
            background: #fdf3e4;
            padding: 8px 12px;
            border-radius: 30px;
            display: inline-block;
            width: auto;
            font-weight: 500;
            border: 1px solid #eeddbb;
        }
        
        .support-hours span {
            font-weight: bold;
            color: #b45f1b;
        }

        /* برای حالت موبایل، اگر نمایشگر خیلی کوچک باشد */
        @media (max-width: 480px) {
            .card {
                padding: 20px 18px 28px 18px;
                border-radius: 40px;
            }
            .image-frame {
                width: 210px;           /* در موبایل کمی کوچکتر اما همچنان بزرگتر از قبل */
                height: 210px;
                border-radius: 38px;
            }
            .price-btn {
                font-size: 1.3rem;
                width: 90%;
            }
            .instagram-btn {
                font-size: 0.75rem;
                padding: 9px 18px;
            }
            .support-hours {
                font-size: 0.65rem;
            }
        }

        /* نکته: غیرفعال کردن هرگونه اسکرول */
        body, html {
            overflow: hidden;
            position: fixed;
        }
        
        .card {
            max-height: 90vh;
            overflow-y: visible;
        }

        button {
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
    
        <div class="image-frame">
    
           
            <img class="product-img" src="logo.png" alt="مکمل ورزشی" id="userImage">
          
        </div>

        <button class="price-btn" id="priceListBtn">📋 لیست قیمت</button>

        <a class="instagram-btn" href="https://www.instagram.com/jonub_supplement/?hl=fa" target="_blank" rel="noopener noreferrer">📷 برگشت به اینستاگرام</a>
        
        <!-- ساعت پشتیبانی فروش (9:30-2 و 17:30-20) -->
        <div class="support-hours">
            🕘 ساعت پشتیبانی فروش : <span>۹:۳۰ تا ۱۴</span> و <span>۱۷ تا ۲۰</span>
        </div>
        
    </div>
</div>

<script>
    (function() {

        const priceBtn = document.getElementById('priceListBtn');
        
       
        function downloadPricePDF() {
      
            const pdfUrl = "price_list.pdf";  
            
          
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = "لیست_قیمت_مکمل.pdf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        if (priceBtn) {
            priceBtn.addEventListener('click', downloadPricePDF);
        }
        
        console.log("صفحه آماده است - کادر لوگو با انیمیشن بالا پایین و بزرگ‌تر");
    })();
</script>


</body>
</html>
