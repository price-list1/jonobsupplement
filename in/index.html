<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مکمل جنوب</title>
    <style>
        /* ریست حاشیه‌ها و فاصله‌ها */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* بدنه اصلی: ارتفاع کامل صفحه، غیرقابل اسکرول */
        body {
            background: linear-gradient(145deg, #1e2a2e 0%, #0f1a1f 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;          /* پنهان کردن اسکرول در کل صفحه */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Tahoma', 'system-ui', 'Roboto', sans-serif;
            padding: 16px;
            margin: 0;
            position: fixed;           /* جلوگیری از هرگونه حرکت غیرمنتظره */
            top: 0;
            left: 0;
        }

        /* کانتینر اصلی برای ثابت نگه داشتن محتوا و متمرکز سازی */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        /* قاب مربع با حاشیه‌های خمیده (border-radius) */
        .card {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 248, 235, 0.97);
            backdrop-filter: blur(0px);
            border-radius: 48px;          /* حاشیه کاملاً خمیده و نرم */
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 150, 0.3);
            padding: 28px 24px 32px 24px;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* محفظه عکس: مربعی با حاشیه خمیده + انیمیشن بالا پایین */
        .image-frame {
            width: 260px;                /* بزرگ‌تر شد از 220 به 260 */
            height: 260px;               /* بزرگ‌تر شد از 220 به 260 */
            margin: 0 auto 20px auto;
            border-radius: 45px;         /* حاشیه خمیده متناسب با اندازه جدید */
            overflow: hidden;
            background: #e9e2d4;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255,255,240,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ffc96e;
            
            /* انیمیشن بالا و پایین رفتن نرم */
            animation: floatAnimation 2.5s ease-in-out infinite;
        }

        /* تعریف انیمیشن شناور (بالا و پایین) */
        @keyframes floatAnimation {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);  /* حرکت به سمت بالا */
            }
            100% {
                transform: translateY(0px);     /* بازگشت به جای اول */
            }
        }

        /* استایل عکس: بزرگ‌تر و با کیفیت */
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* عکس کل فضا را می‌پوشاند - بزرگ دیده می‌شود */
            display: block;
            transition: transform 0.3s ease;
        }
        
        /* افکت کوچک هنگام هاور (دلخواه - اگر موس روی عکس برود کمی بزرگتر شود) */
        .image-frame:hover .product-img {
            transform: scale(1.02);
        }

        /* دکمه لیست قیمت */
        .price-btn {
            background: linear-gradient(95deg, #c27e2e, #e09d3e);
            border: none;
            color: #1e2a1f;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 28px;
            margin: 16px 0 18px 0;
            width: 85%;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
            box-shadow: 0 6px 0 0 #7e4a1a;
            transform: translateY(-2px);
            font-weight: 800;
        }

        .price-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 #7e4a1a;
        }

        /* بخش آیکون‌های واتساپ و روبیکا و شماره فروشگاه (خیلی ریز) */
        .social-mini {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.68rem;
            color: #4a3b2a;
            background: #fff8ef;
            padding: 8px 12px;
            border-radius: 50px;
            display: inline-flex;
            width: auto;
            backdrop-filter: blur(2px);
            font-weight: 500;
            flex-wrap: wrap;
        }

        .social-mini span {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.7rem;
            letter-spacing: 0.2px;
        }

        /* آیکون‌های ساده یونیکد برای واتساپ، روبیکا و تلفن */
        .social-mini span:first-child::before {
            content: "📱 ";
            font-size: 0.8rem;
        }
        .social-mini span:nth-child(2)::before {
            content: "📘 ";
            font-size: 0.8rem;
        }
        .social-mini span:nth-child(3)::before {
            content: "🏪 ";
            font-size: 0.8rem;
        }

        /* ساعت پشتیبانی فروش */
        .support-hours {
            margin-top: 16px;
            font-size: 0.7rem;
            color: #6b4e2e;
            background: #fdf3e4;
            padding: 8px 12px;
            border-radius: 30px;
            display: inline-block;
            width: auto;
            font-weight: 500;
            border: 1px solid #eeddbb;
        }
        
        .support-hours span {
            font-weight: bold;
            color: #b45f1b;
        }

        /* برای حالت موبایل، اگر نمایشگر خیلی کوچک باشد */
        @media (max-width: 480px) {
            .card {
                padding: 20px 18px 28px 18px;
                border-radius: 40px;
            }
            .image-frame {
                width: 210px;           /* در موبایل کمی کوچکتر اما همچنان بزرگتر از قبل */
                height: 210px;
                border-radius: 38px;
            }
            .price-btn {
                font-size: 1.3rem;
                width: 90%;
            }
            .social-mini {
                gap: 14px;
                font-size: 0.6rem;
            }
            .support-hours {
                font-size: 0.65rem;
            }
        }

        /* نکته: غیرفعال کردن هرگونه اسکرول */
        body, html {
            overflow: hidden;
            position: fixed;
        }
        
        .card {
            max-height: 90vh;
            overflow-y: visible;
        }

        button {
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <!-- قاب مربعی حاشیه خمیده + عکس + انیمیشن بالا پایین -->
        <div class="image-frame">
            <!-- 
                =========================================================
                جای عکس: آدرس تصویر خود را در قسمت src قرار دهید.
                عکس بزرگ‌تر دیده می‌شود چون کادر 260x260 شده.
                =========================================================
            -->
            <img class="product-img" src="logo.png" alt="مکمل ورزشی" id="userImage">
            <!-- ↑ در src بالا آدرس تصویر خود را جایگزین کنید ↑ -->
        </div>

        <!-- دکمه لیست قیمت (با قابلیت دانلود PDF) -->
        <button class="price-btn" id="priceListBtn">📋 لیست قیمت</button>

        <!-- متن ریز برای واتساپ، روبیکا و شماره فروشگاه -->
         <div class="social-mini">
            <span>واتساپ : 2122 122 0939</span>
            <span>روبیکا : JONUB_SUPPLEMENT</span>
            <span>شماره فروشگاه : 9147 313 0773</span>
        </div>
        
        <!-- ساعت پشتیبانی فروش (9:30-2 و 17:30-20) -->
        <div class="support-hours">
            🕘 ساعت پشتیبانی فروش : <span>۹:۳۰ تا ۱۴</span> و <span>۱۷:۳۰ تا ۲۰</span>
        </div>
        
    </div>
</div>

<script>
    (function() {
        // دکمه لیست قیمت: با کلیک، فایل PDF دانلود می‌شود
        const priceBtn = document.getElementById('priceListBtn');
        
        // تابع دانلود فایل PDF
        function downloadPricePDF() {
            // ==============================================================
            // لطفا آدرس دقیق فایل PDF لیست قیمت خود را در متغیر زیر وارد کنید
            // ==============================================================
            const pdfUrl = "price_list.pdf";  // <--- آدرس PDF خود را اینجا قرار دهید
            
            // ایجاد یک عنصر <a> مخفی برای دانلود
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = "لیست_قیمت_مکمل.pdf";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        if (priceBtn) {
            priceBtn.addEventListener('click', downloadPricePDF);
        }
        
        console.log("صفحه آماده است - کادر لوگو با انیمیشن بالا پایین و بزرگ‌تر");
    })();
</script>


</body>
</html>
