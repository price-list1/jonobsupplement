<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مکمل فروشی | صفحه ثابت</title>
    <style>
        /* ریست حاشیه‌ها و فاصله‌ها */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* بدنه اصلی: ارتفاع کامل صفحه، غیرقابل اسکرول */
        body {
            background: linear-gradient(145deg, #1e2a2e 0%, #0f1a1f 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden;          /* پنهان کردن اسکرول در کل صفحه */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Tahoma', 'system-ui', 'Roboto', sans-serif;
            padding: 16px;
            margin: 0;
            position: fixed;           /* جلوگیری از هرگونه حرکت غیرمنتظره */
            top: 0;
            left: 0;
        }

        /* کانتینر اصلی برای ثابت نگه داشتن محتوا و متمرکز سازی */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        /* قاب مربع با حاشیه‌های خمیده (border-radius) */
        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 248, 235, 0.97);
            backdrop-filter: blur(0px);
            border-radius: 48px;          /* حاشیه کاملاً خمیده و نرم */
            box-shadow: 0 30px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 215, 150, 0.3);
            padding: 28px 24px 32px 24px;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* محفظه عکس: مربعی با حاشیه خمیده */
        .image-frame {
            width: 220px;
            height: 220px;
            margin: 0 auto 20px auto;
            border-radius: 38px;           /* مربع با انحنای یکسان (حاشیه خمیده) */
            overflow: hidden;
            background: #e9e2d4;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255,255,240,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffc96e;
        }

        /* استایل عکس: کاملاً در قاب قرار می‌گیرد، اعوجاج نداشته باشد */
        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;          /* عکس کل فضا را می‌پوشاند بدون تغییر نسبت */
            display: block;
        }

        /* دکمه لیست قیمت */
        .price-btn {
            background: linear-gradient(95deg, #c27e2e, #e09d3e);
            border: none;
            color: #1e2a1f;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 28px;
            margin: 16px 0 18px 0;
            width: 85%;
            border-radius: 60px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: 0.2s;
            box-shadow: 0 6px 0 0 #7e4a1a;
            transform: translateY(-2px);
            font-weight: 800;
        }

        .price-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 #7e4a1a;
        }

        /* بخش آیکون‌های واتساپ و روبیکا (خیلی ریز) */
        .social-mini {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 0.7rem;          /* خیلی ریز ولی خوانا */
            color: #4a3b2a;
            background: #fff8ef;
            padding: 8px 14px;
            border-radius: 50px;
            display: inline-flex;
            width: auto;
            backdrop-filter: blur(2px);
            font-weight: 500;
        }

        .social-mini span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            letter-spacing: 0.3px;
        }/* آیکون‌های ساده یونیکد برای واتساپ و روبیکا */
        .social-mini span:first-child::before {
            content: "📱 ";
            font-size: 0.85rem;
        }
        .social-mini span:last-child::before {
            content: "📘 ";
            font-size: 0.85rem;
        }

        /* برای حالت موبایل، اگر نمایشگر خیلی کوچک باشد قاب کمی فشرده‌تر شود */
        @media (max-width: 480px) {
            .card {
                padding: 20px 18px 28px 18px;
                border-radius: 40px;
            }
            .image-frame {
                width: 180px;
                height: 180px;
            }
            .price-btn {
                font-size: 1.3rem;
                width: 90%;
            }
            .social-mini {
                gap: 18px;
                font-size: 0.65rem;
            }
        }

        /* نکته: غیرفعال کردن هرگونه اسکرول (دوباره تأکید) */
        body, html {
            overflow: hidden;
            position: fixed;
        }
        
        /* اگر داخل کارت محتوا از ارتفاع دید خارج شود - اما با اندازه ثابت نه */
        .card {
            max-height: 90vh;
            overflow-y: visible;
        }

        /* استایل دکمه برای لینک دانلود فایل PDF */
        button {
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <!-- قاب مربعی حاشیه خمیده + عکس -->
        <div class="image-frame">
            <!-- 
                =========================================================
                جای عکس: آدرس تصویر خود را در قسمت src قرار دهید.
                توصیه می‌شود عکسی با نسبت 1:1 (مربعی) و کیفیت خوب.
                مثال: 
                src="images/product.jpg"
                یا اگر در پوشه فعلی: src="supplement.png"
                =========================================================
            -->
            <img class="product-img" src="logo.png" id="userImage">
            <!-- ↑ در src بالا آدرس تصویر خود را جایگزین کنید ↑ -->
        </div>

        <!-- دکمه لیست قیمت (با قابلیت دانلود PDF) -->
        <button class="price-btn" id="priceListBtn">📋 لیست قیمت</button>

        <!-- متن ریز برای واتساپ و روبیکا (دقیقاً زیر دکمه) -->
        <div class="social-mini">
            <span>واتساپ : ۰۹۱۲XXX۰۰۰</span>
            <span>روبیکا : @SupplementShop</span>
        </div>
        
        <!-- بخش پشتیبانی و ساعت کار کاملاً حذف شد -->
        
    </div>
</div>

<script>
    (function() {
        // دکمه لیست قیمت: با کلیک، فایل PDF دانلود می‌شود
        const priceBtn = document.getElementById('priceListBtn');
        
        // تابع دانلود فایل PDF
        function downloadPricePDF() {
            // ==============================================================
            // لطفا آدرس دقیق فایل PDF لیست قیمت خود را در متغیر زیر وارد کنید
            // ==============================================================
            const pdfUrl = "price_list.pdf";  // <--- آدرس PDF خود را اینجا قرار دهید
            
            // ایجاد یک عنصر <a> مخفی برای دانلود
            const link = document.createElement('a');
            link.href = pdfUrl;
            link.download = "لیست_قیمت_مکمل.pdf";  // نام فایل هنگام ذخیره شدن
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // اختصاص رویداد کلیک به دکمه
        if (priceBtn) {
            priceBtn.addEventListener('click', downloadPricePDF);
        }
        
        // تست وجود فایل PDF (در صورت 404 خطا در کنسول دیده می‌شود اما صفحه نمی‌شکند)
        console.log("صفحه آماده است - دکمه لیست قیمت فایل PDF را دانلود می‌کند.");
    })();
</script>

<!-- راهنمای تنظیم فایل PDF:1. فایل PDF لیست قیمت خود را در همان پوشه فایل HTML قرار دهید.
     2. نام فایل را "price-list.pdf" بگذارید (یا نام دیگر، سپس در کد تغییر دهید).
     3. مثال: اگر فایل شما "prices.pdf" است، در خط 179 مقدار را به "prices.pdf" تغییر دهید.
     
     برای تست در مرورگر:
     - اگر فایل PDF وجود نداشته باشد، دانلود انجام نمی‌شود و خطا در کنسول می‌آید.
     - لطفاً حتماً فایل PDF را در کنار فایل HTML آپلود کنید.
     
     اگر فایل PDF در هاست در مسیر دیگری قرار دارد، آدرس کامل را وارد کنید:
     مثال: "https://example.com/files/price-list.pdf"
-->
</body>
</html>
